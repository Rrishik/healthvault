    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get(
          'scoutTheme',
        );
        const theme =
          param ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-fg: #1a1a1a;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--cp-text);
        background: var(--cp-surface);
        font:
          14px/1.55 'Segoe UI',
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        letter-spacing: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--cp-link);
        outline-offset: 4px;
      }
      [tabindex='-1']:focus {
        outline: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.16;
        font-weight: 650;
        max-width: 780px;
      }
      h2 {
        font-size: 19px;
        line-height: 1.3;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
      }
      a {
        color: var(--cp-link);
        text-underline-offset: 3px;
      }
      .icon {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .spread {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .muted {
        color: var(--cp-text-muted);
      }
      .tiny {
        font-size: 11px;
      }
      .mono {
        font-family: Consolas, 'Courier New', Courier, monospace;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--cp-text-muted);
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border: 1px solid var(--cp-border);
        border-radius: 4px;
        font-size: 10px;
        white-space: nowrap;
      }
      .tag.accent {
        color: var(--cp-accent);
        border-color: var(--cp-accent);
      }
      .btn {
        display: inline-flex;
        justify-content: center;
        gap: 9px;
        align-items: center;
        min-height: 42px;
        padding: 9px 16px;
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .btn:hover:not(:disabled) {
        background: var(--cp-surface-soft);
        border-color: var(--cp-border-strong);
      }
      .btn.primary {
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        border-color: var(--cp-accent);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--cp-accent-hover);
      }
      .icon-btn {
        padding: 0;
        width: 38px;
        height: 38px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        border-radius: 6px;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--cp-surface-soft);
      }
      .text-btn {
        border: 0;
        padding: 4px 0;
        background: none;
        color: var(--cp-accent);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .topbar {
        padding: 16px 30px;
        border-bottom: 1px solid var(--cp-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .publication {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 20px;
        padding: 10px 24px;
        background: var(--cp-surface-soft);
        border-bottom: 1px solid var(--cp-border);
        font-size: 11px;
        color: var(--cp-text-muted);
      }
      .publication-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 19px;
        font-weight: 700;
      }
      .brand .icon {
        width: 29px;
        height: 29px;
        color: var(--cp-accent);
      }
      .top-context {
        font-size: 12px;
        color: var(--cp-text-muted);
      }
      .layout {
        max-width: 1460px;
        margin: auto;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: calc(100vh - 72px);
      }
      .sidebar {
        border-right: 1px solid var(--cp-border);
        padding: 32px 22px;
        background: linear-gradient(
          180deg,
          var(--cp-surface-soft),
          var(--cp-surface)
        );
      }
      .chapter-number {
        font:
          52px/1 Consolas,
          monospace;
        color: var(--cp-accent);
        margin: 17px 0;
      }
      .sidebar h2 {
        font-size: 16px;
      }
      .sidebar p {
        font-size: 11px;
        color: var(--cp-text-muted);
        margin-top: 9px;
      }
      .chapter-nav {
        display: grid;
        gap: 5px;
        margin-top: 30px;
      }
      .chapter-nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 5px;
        padding: 11px 8px;
        font-size: 12px;
      }
      .chapter-nav button[aria-current='step'] {
        background: var(--cp-accent-soft);
        color: var(--cp-accent);
        font-weight: 600;
      }
      .chapter-nav .step-dot {
        width: 21px;
        height: 21px;
        border: 1px solid var(--cp-border-strong);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font:
          10px Consolas,
          monospace;
        flex-shrink: 0;
      }
      .step-dot .icon {
        width: 12px;
        height: 12px;
      }
      .sidebar-bottom {
        margin-top: 40px;
        border-top: 1px solid var(--cp-border);
        padding-top: 18px;
      }
      .main {
        min-width: 0;
        padding: 32px 42px 0;
        display: flex;
        flex-direction: column;
      }
      .stage-head {
        margin-bottom: 25px;
      }
      .stage-head .row {
        margin-bottom: 15px;
      }
      .stage-head .eyebrow {
        margin: 0;
      }
      .stage {
        flex: 1;
      }
      .scene-art {
        width: 100%;
        min-height: 210px;
        background: radial-gradient(
          var(--cp-border) 0.7px,
          var(--cp-surface-soft) 0.7px
        );
        background-size: 16px 16px;
        overflow: hidden;
        margin: 0 0 20px;
        border-block: 1px solid var(--cp-border);
      }
      .scene-art svg {
        width: 100%;
        height: auto;
        max-height: 255px;
        display: block;
      }
      .art-text {
        font-family: 'Segoe UI', sans-serif;
        fill: var(--cp-text);
      }
      .dialogue {
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 14px;
        max-width: 780px;
        margin: 20px 0 26px;
        align-items: start;
      }
      .portrait {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--cp-accent-soft);
      }
      .dialogue .speaker {
        color: var(--cp-accent);
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .dialogue p {
        font-size: 16px;
        line-height: 1.6;
      }
      .question {
        font-size: 14px;
        margin-bottom: 13px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .choice {
        text-align: left;
        padding: 17px;
        border: 1px solid var(--cp-border);
        border-radius: 8px;
        background: var(--cp-surface);
        min-height: 106px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .choice:hover {
        border-color: var(--cp-accent);
      }
      .choice[aria-pressed='true'] {
        border-color: var(--cp-accent);
        background: var(--cp-accent-soft);
      }
      .choice .choice-marker {
        width: 21px;
        height: 21px;
        font:
          10px Consolas,
          monospace;
        border: 1px solid var(--cp-border-strong);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--cp-text-muted);
      }
      .choice strong {
        font-size: 13px;
        font-weight: 600;
      }
      .choice small {
        font-size: 11px;
        color: var(--cp-text-muted);
      }
      .feedback {
        padding: 14px 17px;
        border-left: 3px solid var(--cp-accent);
        background: var(--cp-accent-soft);
        margin-top: 17px;
        font-size: 13px;
        line-height: 1.7;
      }
      .feedback.good {
        border-color: var(--cp-success);
        background: color-mix(in srgb, var(--cp-success) 7%, var(--cp-surface));
      }
      .feedback strong {
        display: block;
        margin-bottom: 4px;
      }
      .footer {
        padding: 22px 0;
        margin-top: 28px;
        border-top: 1px solid var(--cp-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .footer-hint {
        font-size: 11px;
        color: var(--cp-text-muted);
        max-width: 340px;
      }
      .footer .row {
        gap: 8px;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: 20px 0;
        gap: 8px;
      }
      .timeline button {
        border: 0;
        border-top: 3px solid var(--cp-border);
        background: none;
        text-align: left;
        padding: 11px 0;
        font-size: 11px;
        color: var(--cp-text-muted);
      }
      .timeline button[aria-current='step'] {
        border-color: var(--cp-accent);
        color: var(--cp-accent);
      }
      .timeline strong {
        display: block;
        margin-top: 5px;
        font-size: 12px;
      }
      .trace-toolbar {
        padding: 14px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--cp-border);
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
      }
      input[type='checkbox'] {
        accent-color: var(--cp-accent);
        width: 18px;
        height: 18px;
      }
      .trace-board {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px 180px 40px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 30px 0;
        min-height: 195px;
      }
      .token-tray {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 45px;
        align-content: start;
        margin-top: 10px;
      }
      .token {
        display: inline-flex;
        width: 38px;
        height: 38px;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--cp-link);
        color: var(--cp-link);
        background: color-mix(in srgb, var(--cp-link) 6%, var(--cp-surface));
        border-radius: 5px;
        font:
          12px Consolas,
          monospace;
      }
      .token.generated {
        border-color: var(--cp-accent);
        color: var(--cp-accent);
        background: var(--cp-accent-soft);
      }
      .token.cached {
        border-color: var(--cp-success);
        color: color-mix(in srgb, var(--cp-success) 65%, var(--cp-text));
        background: color-mix(in srgb, var(--cp-success) 7%, var(--cp-surface));
      }
      .model-block {
        display: grid;
        place-items: center;
        min-height: 112px;
        padding: 15px;
        border: 1px solid var(--cp-border-strong);
        background: var(--cp-surface-soft);
        border-radius: 8px;
        text-align: center;
        gap: 7px;
      }
      .model-block .icon {
        color: var(--cp-link);
        width: 26px;
        height: 26px;
      }
      .model-block strong {
        font-size: 13px;
      }
      .trace-arrow {
        color: var(--cp-text-soft);
        text-align: center;
      }
      .cache-row {
        padding: 18px 0;
        border-block: 1px solid var(--cp-border);
        display: grid;
        grid-template-columns: 180px 1fr auto;
        align-items: center;
        gap: 15px;
      }
      .cache-row .token-tray {
        margin: 0;
      }
      .cache-row p {
        margin-top: 4px;
        font-size: 11px;
        color: var(--cp-text-muted);
      }
      .trace-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 18px;
        gap: 20px;
        font-size: 12px;
      }
      .trace-summary strong {
        font:
          25px Consolas,
          monospace;
        color: var(--cp-accent);
        margin-right: 8px;
      }
      .attention-detail {
        margin-top: 18px;
        font-size: 12px;
      }
      .attention-detail summary {
        cursor: pointer;
        color: var(--cp-link);
      }
      .attention-detail p {
        margin-top: 12px;
      }
      .mobile-restart {
        display: none;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .lab {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        border-block: 1px solid var(--cp-border);
        margin-top: 20px;
      }
      .lab-controls {
        background: var(--cp-surface-soft);
        padding: 22px;
        border-right: 1px solid var(--cp-border);
      }
      .field {
        margin-bottom: 24px;
      }
      .field label {
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .field output {
        font-family: Consolas, monospace;
        font-weight: 600;
      }
      .field input[type='range'] {
        width: 100%;
        accent-color: var(--cp-accent);
        margin: 0;
        cursor: pointer;
      }
      .field small {
        display: block;
        color: var(--cp-text-muted);
        font-size: 10px;
        margin-top: 7px;
      }
      .segments {
        display: flex;
        border: 1px solid var(--cp-border);
        border-radius: 5px;
        overflow: hidden;
        margin: 10px 0 22px;
      }
      .segments button {
        flex: 1;
        padding: 9px 7px;
        border: 0;
        background: var(--cp-surface);
        font-size: 10px;
      }
      .segments button[aria-pressed='true'] {
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
      }
      .lab-results {
        padding: 22px 24px;
        min-width: 0;
      }
      .budget-stat {
        font:
          34px/1.1 Consolas,
          monospace;
        margin: 12px 0 6px;
      }
      .budget-stat span {
        font-size: 16px;
        color: var(--cp-text-muted);
      }
      .memory-viz {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 28px;
        margin-top: 24px;
        align-items: center;
      }
      .memory-stack {
        display: flex;
        flex-direction: column-reverse;
        height: 220px;
        border: 1px solid var(--cp-border-strong);
        background: repeating-linear-gradient(
          135deg,
          var(--cp-surface),
          var(--cp-surface) 6px,
          var(--cp-surface-soft) 6px,
          var(--cp-surface-soft) 12px
        );
        position: relative;
      }
      .memory-layer {
        width: 100%;
        flex-shrink: 0;
      }
      .weights {
        background: var(--cp-link);
      }
      .overhead {
        background: var(--cp-border-strong);
      }
      .kv {
        background: var(--cp-success);
      }
      .limit-line {
        position: absolute;
        border-top: 2px dashed var(--cp-danger);
        width: calc(100% + 14px);
        left: -7px;
        z-index: 1;
      }
      .legend {
        display: grid;
        gap: 14px;
      }
      .legend-row {
        display: grid;
        grid-template-columns: 9px 1fr;
        gap: 10px;
        align-items: start;
      }
      .legend-row i {
        width: 9px;
        height: 9px;
        margin-top: 4px;
      }
      .legend-row strong {
        font-size: 12px;
        font-weight: 600;
      }
      .legend-row small {
        display: block;
        color: var(--cp-text-muted);
        font-size: 10px;
      }
      .memory-note {
        font-size: 11px;
        margin-top: 17px;
        color: var(--cp-text-muted);
      }
      .budget-status {
        font-size: 12px;
        font-weight: 600;
        color: color-mix(in srgb, var(--cp-success) 65%, var(--cp-text));
      }
      .budget-status.over {
        color: var(--cp-danger);
      }
      .snapshots {
        margin-top: 20px;
      }
      .snapshot-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .snapshot {
        border-bottom: 1px solid var(--cp-border);
        padding: 10px 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        font-size: 11px;
      }
      .snapshot strong {
        font-size: 12px;
      }
      .brief {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-block: 1px solid var(--cp-border);
        margin: 20px 0;
      }
      .brief div {
        padding: 17px 12px;
        border-right: 1px solid var(--cp-border);
      }
      .brief div:last-child {
        border: 0;
      }
      .brief strong {
        display: block;
        font:
          25px Consolas,
          monospace;
      }
      .brief small {
        font-size: 10px;
        color: var(--cp-text-muted);
      }
      .decisions {
        grid-template-columns: 1fr 1fr;
      }
      .queue-strip {
        display: flex;
        gap: 8px;
        margin: 18px 0 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .person-slot {

    <script id="lesson-core">
      globalThis.InferenceLesson = (() => {
        const GiB = 1024 ** 3;
        const model = Object.freeze({
          layers: 32,
          kvHeads: 8,
          headDim: 128,
          bytesPerValue: 2,
          weightsGiB: 14,
          overheadGiB: 2,
          gpuGiB: 24,
        });
        const sources = [
          {
            id: 'cache',
            name: 'Hugging Face / Caching',
            url: 'https://huggingface.co/docs/transformers/en/cache_explanation',
            supports:
              'Per-layer keys and values, autoregressive reuse, and the generation loop.',
          },
          {
            id: 'strategies',
            name: 'Hugging Face / Cache strategies',
            url: 'https://huggingface.co/docs/transformers/en/kv_cache',
            supports:
              'Dynamic and static caches, offloading, and sliding-window exceptions.',
          },
          {
            id: 'paged',
            name: 'PagedAttention / SOSP 2023',
            url: 'https://arxiv.org/abs/2309.06180',
            supports:
              'Allocation waste, sharing, and the relationship between cache memory and serving concurrency.',
          },
        ];
        const chapters = [
          {
            id: 'incident',
            short: 'The incident',
            title: 'It worked for one person.',
            subtitle: '09:02 / Launch day at Folio',
            sourceIds: ['cache'],
          },
          {
            id: 'trace',
            short: 'Inside a request',
            title: 'Read once. Then keep going.',
            subtitle: '09:07 / Following one conversation',
            sourceIds: ['cache'],
          },
          {
            id: 'memory',
            short: 'The memory lab',
            title: 'The weights are not the whole bill.',
            subtitle: '09:12 / On the serving machine',
            sourceIds: ['cache', 'strategies', 'paged'],
          },
          {
            id: 'decision',
            short: 'The launch decision',
            title: 'Eight people. One GPU.',
            subtitle: '09:18 / The doors are still open',
            sourceIds: ['strategies', 'paged'],
          },
          {
            id: 'transfer',
            short: 'A different workload',
            title: 'Tomorrow is not a copy of today.',
            subtitle: 'The next morning / An architecture review',
            sourceIds: ['cache', 'strategies'],
          },
          {
            id: 'debrief',
            short: 'Your field notes',
            title: 'You found the missing memory.',
            subtitle: 'Chapter 01 / Debrief',
            sourceIds: ['cache', 'strategies', 'paged'],
          },
        ];
        function integer(value, name, minimum, maximum) {
          if (!Number.isInteger(value) || value < minimum || value > maximum)
            throw new Error(`Invalid ${name}`);
        }
        function estimate(config) {
          integer(config.concurrent, 'concurrency', 1, 64);
          integer(config.prompt, 'prompt', 1, 131072);
          integer(config.output, 'output', 0, 131072);
          if (!['prefill', 'budget'].includes(config.stage))
            throw new Error('Invalid stage');
          const bytesPerToken =
            2 *
            model.layers *
            model.kvHeads *
            model.headDim *
            model.bytesPerValue;
          const cachedTokens =
            config.prompt + (config.stage === 'budget' ? config.output : 0);
          const perSequence = (bytesPerToken * cachedTokens) / GiB;
          const kvGiB = perSequence * config.concurrent;
          const totalGiB = model.weightsGiB + model.overheadGiB + kvGiB;
          return {
            bytesPerToken,
            cachedTokens,
            perSequence,
            kvGiB,
            totalGiB,
            freeGiB: model.gpuGiB - totalGiB,
            fits: totalGiB <= model.gpuGiB,
            capacity: Math.floor(
              (model.gpuGiB - model.weightsGiB - model.overheadGiB) /
                perSequence,
            ),
          };
        }
        function trace(step, useCache) {
          integer(step, 'trace step', 0, 3);
          if (typeof useCache !== 'boolean')
            throw new Error('Invalid cache mode');
          const processed =
            step === 0 ? 0 : useCache ? step + 2 : [0, 3, 7, 12][step];
          return {
            step,
            phase: step === 0 ? 'Ready' : step === 1 ? 'Prefill' : 'Decode',
            outputTokens: step,
            cachedTokens: step === 0 || !useCache ? 0 : step + 2,
            currentPositions:
              step === 0 ? 0 : useCache && step > 1 ? 1 : step + 2,
            processed,
          };
        }
        const predictions = [
          {
            id: 'weights',
            title: 'Eight people, eight copies of the model?',
            feedback:
              'A single serving replica can share one set of weights across requests. The growing part is elsewhere.',
          },
          {
            id: 'state',
            title: 'Each conversation needs its own working state?',
            feedback:
              "That is the useful lead. Let's follow what the model keeps while a conversation is being generated.",
          },
          {
            id: 'answers',
            title: 'The completed answers fill the GPU?',
            feedback:
              'The important cache here is not a store of finished answer text. It holds attention keys and values for processed tokens.',
          },
        ];
        const decisions = [
          {
            id: 'queue',
            title: 'Admit six. Queue two.',
            note: 'Keep the full documents and output allowance.',
            success: true,
            feedback:
              'Six active sequences budget 23.5 GiB. Two requests wait outside the GPU batch and can enter as active requests finish. Memory fits this model; waiting increases latency, which still needs measurement.',
          },
          {
            id: 'shorten',
            title: 'Cut every document in half.',
            note: 'Admit all eight at once.',
            success: false,
            feedback:
              'The estimate falls to 22 GiB, but this launch requires the full 8,192-token documents. Truncation breaks that requirement and can remove needed evidence.',
          },
          {
            id: 'all',
            title: 'Admit all eight unchanged.',
            note: 'The weights already fit.',
            success: false,
            feedback:
              'At the prompt boundary the estimate is exactly 24 GiB. Reserving room for generation raises it to 26 GiB. Loaded weights alone do not establish serving capacity.',
          },
          {
            id: 'nocache',
            title: 'Turn off the KV cache.',
            note: 'Trade memory for repeated computation.',
            success: false,
            feedback:
              'This changes the execution path and may reduce persistent cache memory, but it repeats prefix computation. Our fixed runtime-overhead assumption no longer establishes its memory or latency. It is an unvalidated alternative, not a proven launch fix.',
          },
        ];
        function decision(id) {
          const choice = decisions.find((item) => item.id === id);
          if (!choice) throw new Error('Unknown decision');
          return choice;
        }
        function assessTransfer(count, reason) {
          integer(count, 'transfer count', 1, 16);
          if (!['same', 'shrinks', 'peruser'].includes(reason))
            throw new Error('Unknown explanation');
          const result = estimate({
            concurrent: count,
            prompt: 4096,
            output: 2048,
            stage: 'budget',
          });
          return {
            passed: count === result.capacity && reason === 'same',
            capacity: result.capacity,
            totalGiB: result.totalGiB,
            feedback:
              count !== result.capacity
                ? `Each sequence budgets 0.75 GiB. The 8 GiB left after weights and assumed overhead can hold ten: 23.5 GiB total. Eleven would need 24.25 GiB.`
                : reason !== 'same'
                  ? 'Ten fits, but the weights do not shrink with shorter documents or multiply for each user in this replica. It is the per-sequence KV budget that changes.'
                  : "Ten sequences fit the stated logical budget. The shared weights remain 14 GiB; the shorter input reduces each sequence's KV budget to 0.75 GiB. This is a memory estimate, not a throughput guarantee.",
          };
        }
        return {
          model,
          sources,
          chapters,
          predictions,
          decisions,
          estimate,
          trace,
          decision,
          assessTransfer,
        };
      })();
    </script>

            stopTimer();
            state.traceStep = Number(data.trace);
            state.traceSeen ||= state.traceStep === 3;
            render(`[data-trace="${data.trace}"]`);
            return;
          }
          if (data.boundary) {
            state.lab.stage = data.boundary;
            render(`[data-boundary="${data.boundary}"]`);
            return;
          }
          if (data.restore !== undefined) {
            state.lab = { ...state.snapshots[Number(data.restore)].config };
            render(`[data-restore="${data.restore}"]`);
            announce('Experiment restored.');
            return;
          }
          if (data.choice) {
            state.choice = data.choice;
            state.decisionPassed = lesson.decision(data.choice).success;
            render(`[data-choice="${data.choice}"]`);
            return;
          }
          switch (data.action) {
            case 'continue':
              if (canContinue()) {
                const next = state.step === 5 ? 2 : state.step + 1;
                state.unlocked = Math.max(state.unlocked, next);
                go(next);
              }
              break;
            case 'back':
              if (state.step > 0) go(state.step - 1);
              break;
            case 'trace-next':
              stopTimer();
              state.traceStep = Math.min(3, state.traceStep + 1);
              state.traceSeen ||= state.traceStep === 3;
              render(
                state.traceStep === 3
                  ? '[data-action="continue"]'
                  : '[data-action="trace-next"]',
              );
              break;
            case 'trace-reset':
              stopTimer();
              state.traceStep = 0;
              render('[data-action="trace-reset"]');
              break;
            case 'trace-play':
              if (timer) {
                stopTimer();
                render('[data-action="trace-play"]');
                break;
              }
              if (state.traceStep === 3) state.traceStep = 0;
              timer = setInterval(() => {
                state.traceStep++;
                state.traceSeen ||= state.traceStep === 3;
                if (state.traceStep === 3) stopTimer();
                const focused = document.activeElement?.dataset.action;
                render(focused ? `[data-action="${focused}"]` : null);
                if (state.traceStep === 3)
                  announce(
                    'Request complete. Three output tokens sampled; five input positions processed with caching, twelve without.',
                  );
              }, 1500);
              render('[data-action="trace-play"]');
              break;
            case 'snapshot': {
              state.snapshots.push({
                config: { ...state.lab },
                result: lesson.estimate(state.lab),
              });
              if (state.snapshots.length > 4) state.snapshots.shift();
              render('[data-action="snapshot"]');
              announce('Experiment saved to your notebook.');
              break;
            }
            case 'lab-reset':
              state.lab = {
                concurrent: 8,
                prompt: 8192,
                output: 2048,
                stage: 'budget',
              };
              render('[data-action="lab-reset"]');
              break;
            case 'sources':
              showDialog('sources');
              break;
            case 'restart':
              showDialog('restart');
              break;
            case 'confirm-restart':
              stopTimer();
              details.close();
              state = initial();
              render(null, true);
              announce('Chapter restarted.');
              break;
            case 'close':
              closeDialog();
              break;
            case 'theme':
              stopTimer();
              document.documentElement.dataset.theme =
                document.documentElement.dataset.theme === 'dark'
                  ? 'light'
                  : 'dark';
              render('[data-action="theme"]');
              break;
          }
        });
        app.addEventListener('input', (event) => {
          const target = event.target;
          if (['concurrent', 'prompt', 'output'].includes(target.id)) {
            state.lab[target.id] = Number(target.value);
            document.getElementById(`${target.id}-value`).textContent = format(
              Number(target.value),
            );
            document.getElementById('memory-results').innerHTML =
              memoryReadout();
          }
          if (target.id === 'transfer-count') {
            state.count = target.value;
            clearTransfer();
          }
          if (target.id === 'transfer-reason') {
            state.reason = target.value;
            clearTransfer();
          }
        });
        function clearTransfer() {
          state.transfer = null;
          app.querySelector('.stage > .feedback')?.remove();
          app.querySelector('[data-action="continue"]').disabled = true;
          app.querySelector('.footer-hint').textContent =
            'Check the capacity and explain the shared weights.';
        }
        app.addEventListener('change', (event) => {
          if (event.target.id === 'use-cache') {
            stopTimer();
            state.useCache = event.target.checked;
            render('#use-cache');
          }
          if (['concurrent', 'prompt', 'output'].includes(event.target.id))
            announce(
              `Memory budget ${fixed(lesson.estimate(state.lab).totalGiB)} of 24 GiB.`,
            );
        });
        app.addEventListener('submit', (event) => {
          if (event.target.id !== 'transfer-form') return;
          event.preventDefault();
          const count = Number(state.count);
          if (
            !Number.isInteger(count) ||
            count < 1 ||
            count > 16 ||
            !state.reason
          )
            return;
          state.transfer = lesson.assessTransfer(count, state.reason);
          state.transferAttempts++;
          render('#transfer-count');
          announce(state.transfer.feedback);
        });
        details.addEventListener('cancel', () => {
          dialogOpener?.focus({ preventScroll: true });
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && timer) {
            stopTimer();
            render();
          }
        });
        window
          .matchMedia('(max-width: 560px)')
          .addEventListener('change', (event) => {
            app
              .querySelector('.scene-art svg')
              ?.setAttribute(
                'viewBox',
                event.matches ? '448 15 403 235' : '0 0 900 250',
              );
          });
        render();
      })();
    </script>
  </body>
</html>
